name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          find src examples tests -name "*.sh" -print0 | xargs -0 shellcheck --severity=error

  syntax-check:
    name: Bash Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        run: |
          find src examples tests -name "*.sh" -print0 | xargs -0 -I {} bash -n {}

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run test suite
        run: bash tests/run-all.sh
